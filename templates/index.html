{% extends 'base.html' %}

{% block title %}Accueil — GUDLFT{% endblock %}

{% block content %}
<div class="card">
  <h2>Bienvenue sur le portail d'inscription GUDLFT</h2>

  <p>Veuillez entrer l'email du secrétaire pour continuer :</p>
  <form action="showSummary" method="post">
      <label for="email">Email:</label>
      <input type="email" name="email" id="email" required/>
      <button type="submit" class="button">Entrer</button>
  </form>
</div>

{% endblock %}
