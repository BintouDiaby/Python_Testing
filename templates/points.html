{% extends 'base.html' %}

{% block title %}Points des clubs — GUDLFT{% endblock %}

{% block content %}
<h2>Clubs & leurs points</h2>
<div class="points-list">
  {% for club in clubs %}
  <div class="card points-item">
    <div class="club-name">{{ club['name'] }}</div>
    <div class="club-points">{{ club['points'] }} pts</div>
    <div class="club-email">{{ club['email'] }}</div>
  </div>
  {% endfor %}
</div>
{% endblock %}
